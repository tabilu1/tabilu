<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiệm Đặt Hàng & Quản Lý Pastel Style</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            /* Tone màu nền Pastel Hồng - Xanh nhẹ nhàng */
            background: linear-gradient(135deg, #fbcfe8 0%, #e0e7ff 50%, #ccfbf1 100%);
            background-attachment: fixed;
        }
        .pastel-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 182, 193, 0.3);
        }
        /* Hiệu ứng sticker trôi nổi đáng yêu */
        .floating-sticker {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body class="text-slate-700 min-h-screen relative overflow-x-hidden">

    <!-- PHẦN 1: MÀN HÌNH CHỌN VAI TRÒ (TRANG CHỦ) -->
    <div id="roleSelectScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="pastel-card p-8 rounded-[35px] shadow-2xl max-w-md w-full text-center relative">
            <!-- Icon sticker trang trí góc -->
            <img src="https://i.pinimg.com/736x/dd/6c/52/dd6c524f92635cca240512d6c86560f2.jpg" class="absolute -top-10 -left-8 w-20 h-20 object-contain floating-sticker rounded-full shadow-md bg-white p-1" alt="Sticker">
            <img src="https://i.pinimg.com/736x/bf/3d/68/bf3d681a5841f6511b55621f24a1ff15.jpg" class="absolute -bottom-8 -right-6 w-18 h-18 object-contain floating-sticker rounded-full shadow-md bg-white p-1" style="animation-delay: 1.5s;" alt="Sticker">

            <div class="w-20 h-20 bg-gradient-to-tr from-pink-300 to-sky-300 rounded-3xl mx-auto flex items-center justify-center text-white text-3xl shadow-lg mb-6">
                <i class="fa-solid fa-cloud-moon text-pink-600"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-pink-500 mb-1">Tiệm Order Xinh Xắn</h1>
            <p class="text-xs text-slate-500 mb-8">Hệ thống đặt hàng & quản lý tone Pastel</p>
            
            <div class="space-y-4">
                <button onclick="openCustomerPortal()" class="w-full py-4 px-6 bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-bold rounded-2xl shadow-lg shadow-pink-300/50 transition transform active:scale-95 flex items-center justify-center gap-3 text-base">
                    <i class="fa-solid fa-heart text-white"></i> Khách Hàng Đặt Đơn
                </button>
                <button onclick="promptAdminLogin()" class="w-full py-4 px-6 bg-gradient-to-r from-sky-400 to-indigo-400 hover:from-sky-500 hover:to-indigo-500 text-white font-bold rounded-2xl shadow-lg shadow-sky-300/50 transition transform active:scale-95 flex items-center justify-center gap-3 text-base">
                    <i class="fa-solid fa-key text-white"></i> Chủ Shop (Quản Trị)
                </button>
            </div>
        </div>
    </div>

    <!-- PHẦN 2: GIAO DIỆN KHÁCH HÀNG -->
    <div id="customerPortal" class="hidden min-h-screen pb-12">
        <header class="bg-white/70 backdrop-blur-md shadow-sm border-b border-pink-100">
            <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <img src="https://i.pinimg.com/736x/53/3c/04/533c047c159bbe2e89e6681722178989.jpg" class="w-10 h-10 rounded-full object-cover shadow" alt="Icon">
                    <h1 class="text-base font-bold text-pink-600">Góc Đặt Hàng Của Bạn</h1>
                </div>
                <button onclick="backToHome()" class="bg-pink-100 hover:bg-pink-200 text-pink-600 px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-house"></i> Quay lại
                </button>
            </div>
        </header>

        <main class="max-w-2xl mx-auto px-4 mt-8">
            <div class="pastel-card rounded-[30px] shadow-xl p-6 sm:p-8 relative">
                <!-- Icon trang trí form -->
                <img src="https://i.pinimg.com/736x/24/30/59/243059932e8608874832bde529f03529.jpg" class="absolute -top-8 right-6 w-16 h-16 object-cover rounded-full shadow-md floating-sticker bg-white p-1" alt="Sticker">

                <div class="text-center mb-6">
                    <h2 class="text-xl font-extrabold text-pink-600">Phiếu Gửi Thông Tin Đơn Hàng</h2>
                    <p class="text-xs text-slate-500 mt-1">Điền đầy đủ thông tin để shop lên đơn cho bạn nha!</p>
                </div>

                <form onsubmit="submitCustomerOrder(event)" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-pink-500 mb-1">Họ và Tên *</label>
                            <input type="text" id="cusName" required placeholder="Tên của bạn..." class="w-full px-4 py-3 rounded-2xl border border-pink-200 text-sm focus:ring-2 focus:ring-pink-400 focus:outline-none bg-white/80">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-pink-500 mb-1">Số Điện Thoại *</label>
                            <input type="text" id="cusPhone" required placeholder="SĐT liên hệ..." class="w-full px-4 py-3 rounded-2xl border border-pink-200 text-sm focus:ring-2 focus:ring-pink-400 focus:outline-none bg-white/80">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 p-4 bg-pink-50/50 rounded-2xl border border-pink-100">
                        <div>
                            <label class="block text-xs font-bold text-pink-600 mb-1">Tỉnh / Thành Phố Mới *</label>
                            <select id="cusProvNew" onchange="toggleCustomInput(this, 'cusProvNewCustom')" class="w-full px-3 py-2.5 rounded-xl border border-pink-200 text-sm mb-2 bg-white">
                                <option value="">-- Chọn Tỉnh/Thành --</option>
                                <option value="Hồ Chí Minh">TP. Hồ Chí Minh</option>
                                <option value="Hà Nội">Hà Nội</option>
                                <option value="Đà Nẵng">Đà Nẵng</option>
                                <option value="Bình Dương">Bình Dương</option>
                                <option value="Đồng Nai">Đồng Nai</option>
                                <option value="Khác">Khác (Tự nhập tay)...</option>
                            </select>
                            <input type="text" id="cusProvNewCustom" placeholder="Nhập tên tỉnh/thành..." class="hidden w-full px-3 py-2 rounded-xl border border-pink-200 text-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-pink-600 mb-1">Tỉnh / Thành Phố Cũ (Nếu có)</label>
                            <select id="cusProvOld" onchange="toggleCustomInput(this, 'cusProvOldCustom')" class="w-full px-3 py-2.5 rounded-xl border border-pink-200 text-sm mb-2 bg-white">
                                <option value="">-- Không có / Chọn Tỉnh cũ --</option>
                                <option value="Hà Tây cũ">Hà Tây cũ</option>
                                <option value="Sông Bé cũ">Sông Bé cũ</option>
                                <option value="Khác">Khác (Tự nhập tay)...</option>
                            </select>
                            <input type="text" id="cusProvOldCustom" placeholder="Nhập tên tỉnh cũ..." class="hidden w-full px-3 py-2 rounded-xl border border-pink-200 text-sm bg-white">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-pink-500 mb-1">Địa Chỉ Nhận Hàng Chi Tiết *</label>
                        <textarea id="cusAddress" required rows="2" placeholder="Số nhà, tên đường, phường/xã..." class="w-full px-4 py-3 rounded-2xl border border-pink-200 text-sm focus:ring-2 focus:ring-pink-400 focus:outline-none bg-white/80"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-pink-500 mb-1">Tên Sản Phẩm / Link Đặt Hàng *</label>
                        <input type="text" id="cusProduct" required placeholder="Dán link sản phẩm hoặc mô tả..." class="w-full px-4 py-3 rounded-2xl border border-pink-200 text-sm focus:ring-2 focus:ring-pink-400 focus:outline-none bg-white/80">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-pink-500 mb-1">Số Lượng</label>
                            <input type="number" id="cusQty" value="1" min="1" class="w-full px-4 py-3 rounded-2xl border border-pink-200 text-sm bg-white/80">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-pink-500 mb-1">Ghi Chú Thêm (Màu, size...)</label>
                            <input type="text" id="cusNote" placeholder="Ví dụ: Màu hồng, size M" class="w-full px-4 py-3 rounded-2xl border border-pink-200 text-sm bg-white/80">
                        </div>
                    </div>

                    <button type="submit" class="w-full py-4 bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-bold rounded-2xl shadow-lg shadow-pink-300/50 transition text-base mt-4 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Gửi Đơn Hàng Ngay
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- PHẦN 3: GIAO DIỆN CHỦ SHOP (ADMIN) -->
    <div id="adminPortal" class="hidden min-h-screen">
        <header class="bg-white/70 backdrop-blur-md shadow-sm border-b
